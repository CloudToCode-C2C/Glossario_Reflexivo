<div class="form-container">
  <h3>Adicionar expressão de {{ categoriaAtual }}</h3>

  <form [formGroup]="verbeteForm" (ngSubmit)="onSubmit()">
    <div class="input-group">
      <label for="expressao">Gíria ou Expressão:</label>
      <input type="text" id="expressao" formControlName="expressao">
    </div>

    <div class="input-group">
      <label for="significado">Significado e Contexto de uso:</label>
      <textarea id="significado" formControlName="significado" rows="3"></textarea>
    </div>

    <button type="submit" [disabled]="verbeteForm.invalid || estaAEnviar" class="btn-enviar">
      {{ estaAEnviar ? 'Enviando...' : 'Enviar Contribuição' }}
    </button>
  </form>

  @if (mensagemSucesso) {
    <div class="msg-sucesso">
      <p>Expressão enviada com sucesso!</p>
    </div>
  }
</div>
