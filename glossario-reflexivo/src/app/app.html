@if (usuarioLogado) {
  <header style="max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #fff; border-bottom: 1px solid #eaeaea;">
    <span style="font-size: 0.8rem; color: #555;">
      Conectado: <strong>{{ usuarioLogado.email }}</strong>
    </span>
    <button (click)="sair()" style="background: none; border: 1px solid #dc2626; color: #dc2626; padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
      Sair
    </button>
  </header>
}

<main style="padding-bottom: 80px; max-width: 600px; margin: 2rem auto;">
  <!-- O outlet injeta a tela pública ou a página protegida correspondente à rota atual. -->
  <router-outlet></router-outlet>
</main>

<!-- A navegação inferior só é exposta depois que a sessão autenticada foi confirmada. -->
@if (usuarioLogado) {
  <app-bottom-nav></app-bottom-nav>
}
