<section class="mural-container">
    <!-- O mural limita a leitura aos verbetes que pertencem à categoria atual. -->
    <h4>Contribuições sobre: {{ categoriaFiltro() }}</h4>

    @if (carregando()) {
        <p class="msg-vazia">Carregando constribuições da turma...</p>
    } @else {
        <div class="lista-cards">
            @for (verbete of verbetesFiltrados(); track verbete.id) {
                <app-card-giria [dadosGiria]="verbete"></app-card-giria>
            } @empty {
                <p class="msg-vazia">Nenhum aluno registrou gírias para esta categoria ainda. Seja o primeiro!</p>
            }
        </div>
    }
</section>
